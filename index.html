<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Esfihas</title>
<style>
:root {
  --bg: #fff8ef; --card: #ffffff; --text: #3b2a1a; --muted: #8a7360;
  --accent: #d9480f; --accent-text: #ffffff; --line: #f0e2d0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1812; --card: #2b231b; --text: #f5e9dc; --muted: #a8957f;
    --accent: #ff8a4c; --accent-text: #1e1812; --line: #3d3228;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1812; --card: #2b231b; --text: #f5e9dc; --muted: #a8957f;
  --accent: #ff8a4c; --accent-text: #1e1812; --line: #3d3228;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}
main { width: 100%; max-width: 360px; text-align: center; }
h1 { font-size: 1.4rem; margin: 0 0 24px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 32px 20px; margin-bottom: 20px;
}
.num {
  font-size: 5rem; font-weight: 800; line-height: 1; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.label { color: var(--muted); margin-top: 8px; }
.controls { display: flex; gap: 12px; }
button {
  font: inherit; cursor: pointer; border-radius: 16px; min-height: 64px;
  -webkit-tap-highlight-color: transparent; border: 1px solid var(--line);
  background: var(--card); color: var(--text);
}
button:active { transform: scale(.97); }
button.minus { flex: 1; }
button.plus { flex: 2; background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-size: 1.6rem; font-weight: 700; }
button.minus { font-size: 1.6rem; }
.reset {
  margin-top: 24px; background: transparent; color: var(--muted);
  min-height: 40px; font-size: .9rem; border-color: transparent;
}
</style>
</head>
<body>
<main>
  <h1>🥟 Minhas Esfihas</h1>
  <div class="card">
    <div class="num" id="num" aria-live="polite">0</div>
    <div class="label">esfihas comidas</div>
  </div>
  <div class="controls">
    <button class="minus" id="menos" type="button" aria-label="Diminuir">−</button>
    <button class="plus" id="mais" type="button">+1</button>
  </div>
  <button class="reset" id="zerar" type="button">Zerar</button>
</main>

<script>
const KEY = "minhas-esfihas-v1";
let total = 0;

try {
  total = parseInt(localStorage.getItem(KEY), 10) || 0;
} catch (e) {
  total = 0;
}

function salvar() {
  try { localStorage.setItem(KEY, String(total)); } catch (e) {}
}

function atualizar() {
  document.getElementById("num").textContent = total;
}

document.getElementById("mais").addEventListener("click", () => {
  total++;
  salvar();
  atualizar();
});

document.getElementById("menos").addEventListener("click", () => {
  if (total > 0) {
    total--;
    salvar();
    atualizar();
  }
});

document.getElementById("zerar").addEventListener("click", () => {
  if (confirm("Zerar o contador?")) {
    total = 0;
    salvar();
    atualizar();
  }
});

atualizar();
</script>
</body>
</html>
